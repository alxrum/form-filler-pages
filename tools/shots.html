<!doctype html>
<html><head><meta charset="utf-8"><style>
/* Illustrations of the welcome steps: a reduced Chrome toolbar on a grey card, puzzle and pin enlarged, red arrows.
   Rendered to welcome/step-*.png by tools/render-shots.js. Methodology: module 3, step 4. */
* { box-sizing: border-box; margin: 0; }
body { background: transparent; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
.card { width: 640px; padding: 28px; background: #e9e6e1; border-radius: 16px; position: relative; }
.win { background: #fff; border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.1); overflow: visible; position: relative; }
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #f1f3f4; border-radius: 10px 10px 0 0; }
.omni { flex: 1; height: 30px; border-radius: 15px; background: #fff; display: flex; align-items: center; padding: 0 14px; color: #5f6368; font-size: 13px; }
.tb { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #5f6368; position: relative; }
.tb.big { width: 46px; height: 46px; background: #fff; box-shadow: 0 0 0 3px #e5322d; }
.tb svg { width: 20px; height: 20px; }
.tb.big svg { width: 28px; height: 28px; }
.page { height: 150px; display: grid; place-items: center; color: #9aa0a6; font-size: 22px; letter-spacing: .5px; }
.page b { color: #4285f4; } .page b:nth-child(2) { color: #ea4335; } .page b:nth-child(3) { color: #fbbc05; } .page b:nth-child(4) { color: #4285f4; } .page b:nth-child(5) { color: #34a853; } .page b:nth-child(6) { color: #ea4335; }
.arrow { position: absolute; width: 90px; height: 70px; }
.menu { position: absolute; top: 58px; right: 8px; width: 300px; background: #fff; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.2); padding: 10px 0; }
.menu h6 { font-size: 13px; color: #5f6368; font-weight: 600; padding: 4px 16px 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 8px 16px; font-size: 15px; color: #202124; }
.item .logo { width: 22px; height: 22px; }
.item .name { flex: 1; }
.pin { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 3px #e5322d; color: #5f6368; position: relative; }
.pin svg { width: 24px; height: 24px; }
.popup { position: absolute; top: 62px; right: 10px; width: 250px; background: #fbf9f6; border: 1px solid #e3ded7; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.2); padding: 18px 16px; text-align: center; }
.popup .hero { width: 44px; height: 44px; border-radius: 12px; background: #fbeccd; margin: 0 auto 10px; display: grid; place-items: center; }
.popup b { display: block; font-size: 15px; margin-bottom: 6px; color: #2a2520; }
.popup p { font-size: 12px; color: #6f665d; margin-bottom: 12px; }
.popup .btn { background: #e8a440; color: #2a2016; font-weight: 600; border-radius: 8px; padding: 9px; font-size: 13px; }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="logo" viewBox="0 0 24 24"><rect width="24" height="24" rx="6.5" fill="#e8a440"/><rect x="5" y="6" width="14" height="4" rx="1.4" fill="none" stroke="#2a2016" stroke-width="1.7"/><rect x="5" y="13" width="8" height="4" rx="1.4" fill="none" stroke="#2a2016" stroke-width="1.7"/><path d="m14.6 15.4 1.9 1.9 3.3-3.6" fill="none" stroke="#2a2016" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="puzzle" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path fill="currentColor" d="M16 9V4h1a1 1 0 0 0 0-2H7a1 1 0 0 0 0 2h1v5a3 3 0 0 1-3 3v2h6v7l1 1 1-1v-7h6v-2a3 3 0 0 1-3-3z"/></symbol>
  <symbol id="arrow" viewBox="0 0 90 70"><path d="M8 62 C 30 58, 58 42, 72 14" fill="none" stroke="#e5322d" stroke-width="6" stroke-linecap="round"/><path d="M58 18 L74 8 L78 28" fill="none" stroke="#e5322d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<!-- arrow: its head is the top-right corner of the 90x70 box; the box is placed so the head touches the ringed target -->
<div class="card" id="step-1"><div class="win">
  <div class="bar"><div class="omni">google.com</div><div class="tb big"><svg><use href="#puzzle"/></svg></div></div>
  <div class="page"><div><b>G</b><b>o</b><b>o</b><b>g</b><b>l</b><b>e</b></div></div>
  <svg class="arrow" style="right:46px; top:56px"><use href="#arrow"/></svg>
</div></div>

<div class="card" id="step-2"><div class="win" style="height:270px">
  <div class="bar"><div class="omni">google.com</div><div class="tb"><svg><use href="#puzzle"/></svg></div></div>
  <div class="menu"><h6>Extensions</h6>
    <div class="item"><svg class="logo"><use href="#logo"/></svg><span class="name">Form Filler</span><span class="pin"><svg><use href="#pin"/></svg></span></div>
  </div>
  <svg class="arrow" style="right:6px; top:150px; transform: rotate(-12deg)"><use href="#arrow"/></svg>
</div></div>

<div class="card" id="step-3"><div class="win">
  <div class="bar"><div class="omni">google.com</div><div class="tb big"><svg><use href="#logo"/></svg></div><div class="tb"><svg><use href="#puzzle"/></svg></div></div>
  <div class="page"><div><b>G</b><b>o</b><b>o</b><b>g</b><b>l</b><b>e</b></div></div>
  <svg class="arrow" style="right:90px; top:56px"><use href="#arrow"/></svg>
</div></div>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Help us improve Form Filler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6.5' fill='%23e8a33d'/%3E%3Crect x='5' y='6' width='14' height='4' rx='1.4' fill='none' stroke='%232a2016' stroke-width='1.7'/%3E%3Crect x='5' y='13' width='8' height='4' rx='1.4' fill='none' stroke='%232a2016' stroke-width='1.7'/%3E%3Cpath d='m14.6 15.4 1.9 1.9 3.3-3.6' fill='none' stroke='%232a2016' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1815; --card: #24201c; --line: #3a342d; --fg: #f3ede4; --muted: #b6ab9c; --accent: #e8a33d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 "Instrument Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .shell { max-width: 780px; margin: 0 auto; padding: 48px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
  .mark { width: 40px; height: 40px; flex: none; }
  .brand { font-weight: 600; font-size: 18px; }
  h1 { font-size: 36px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 10px; }
  .lead { color: var(--muted); font-size: 18px; margin: 0 0 28px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 12px; }
  label.q { font-weight: 600; font-size: 17px; }
  textarea { width: 100%; min-height: 140px; resize: vertical; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #1f1c18; color: var(--fg); font: inherit; }
  textarea::placeholder { color: #8a8073; }
  button { justify-self: start; padding: 12px 22px; border: 0; border-radius: 10px; background: var(--accent); color: #2a2016; font: 600 16px/1 inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .thanks { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .thanks b { display: block; font-size: 20px; margin-bottom: 4px; }
  footer { margin-top: 56px; color: var(--muted); font-size: 14px; display: flex; gap: 20px; flex-wrap: wrap; }
  footer a { color: var(--muted); }
  @media (max-width: 560px) { h1 { font-size: 28px; } }
</style>
</head>
<body>
<div class="shell">
  <header>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6.5" fill="#e8a33d"/><rect x="5" y="6" width="14" height="4" rx="1.4" fill="none" stroke="#2a2016" stroke-width="1.7"/><rect x="5" y="13" width="8" height="4" rx="1.4" fill="none" stroke="#2a2016" stroke-width="1.7"/><path d="m14.6 15.4 1.9 1.9 3.3-3.6" fill="none" stroke="#2a2016" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="brand">Form Filler</span>
  </header>

  <h1>Help us improve Form Filler</h1>
  <p class="lead">Thanks for the honest rating. Tell us what should be better — it takes half a minute.</p>

  <form id="feedback">
    <label class="q" for="details">What should be better?</label>
    <textarea id="details" name="details" maxlength="5000"></textarea>
    <button type="submit" id="send" disabled>Send feedback</button>
  </form>
  <div class="thanks" id="thanks" role="status"><b>Thank you. Every answer counts.</b></div>

  <footer>
    <a href="https://alxrum.github.io/form-filler-privacy/">Privacy</a>
    <a href="https://github.com/alxrum/form-filler-pages/issues">Report a problem</a>
  </footer>
</div>
<script>
// Google Form "Form Filler — feedback" (rating 1–3 in the popup lands here). Fill in from the form's pre-filled link:
// FORM_ID from .../forms/d/e/<FORM_ID>/viewform, ENTRY_DETAILS from the entry.<number> parameter.
// While they are empty the page shows the thank-you note without sending anything.
const FORM_ID = '1FAIpQLScLR2q2vrQF8ELgheeZMas5SzEBwgFqMl-Eyk6oJL0wGS6umg';
const ENTRY_DETAILS = 'entry.1763103177';

const form = document.getElementById('feedback');
const send = document.getElementById('send');
const details = document.getElementById('details');
details.addEventListener('input', () => { send.disabled = !details.value.trim(); });
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = details.value.trim();
  if (!text) return; // empty text is never sent
  send.disabled = true;
  if (FORM_ID && ENTRY_DETAILS) {
    const body = new FormData();
    body.append(ENTRY_DETAILS, text);
    try { await fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`, { method: 'POST', mode: 'no-cors', body }); } catch (err) { /* the answer is still thanked */ }
  }
  form.style.display = 'none';
  document.getElementById('thanks').style.display = 'block';
});
</script>
</body>
</html>

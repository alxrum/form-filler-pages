<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Filler — test form</title>
<style>
  :root { --bg: #faf8f5; --fg: #2a2520; --muted: #6f665d; --line: #e4ded6; --accent: #e8a440; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; } p.lead { color: var(--muted); margin: 0 0 24px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .full { grid-column: 1 / -1; } label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  input, select, textarea { font: inherit; color: var(--fg); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  textarea { min-height: 90px; } .check { display: flex; gap: 8px; align-items: center; font-weight: 500; color: var(--fg); }
  button { grid-column: 1 / -1; justify-self: start; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); font: 600 15px/1 inherit; cursor: pointer; }
  #sent { grid-column: 1 / -1; color: #2f7d4f; font-weight: 600; }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Test form for Form Filler</h1>
  <p class="lead">A regular web form for checking the extension. Nothing is sent anywhere: the button only shows a message.</p>
  <form id="f" autocomplete="off">
    <label>First name<input name="first_name"></label>
    <label>Last name<input name="last_name"></label>
    <label>Email<input type="email" name="email"></label>
    <label>Phone<input type="tel" name="phone"></label>
    <label>Date of birth<input type="date" name="birthday"></label>
    <label>Country<select name="country"><option value="">Select…</option><option>Canada</option><option>Germany</option><option>United Kingdom</option><option>United States</option></select></label>
    <label class="full">Street address<input name="address"></label>
    <label>City<input name="city"></label>
    <label>ZIP / Postal code<input name="zip"></label>
    <label>Company<input name="company"></label>
    <label>Job title<input name="job_title"></label>
    <label class="full">Password<input type="password" name="password"></label>
    <label class="full">Comments<textarea name="comments"></textarea></label>
    <label class="check full"><input type="checkbox" name="terms"> I agree to the Terms and Privacy Policy</label>
    <button type="submit">Submit</button>
    <div id="sent" hidden>Form checked. Nothing was sent.</div>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('sent').hidden = false; });
</script>
</body>
</html>
